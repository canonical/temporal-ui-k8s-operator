name: Integration tests

on:
  pull_request:
  workflow_call:

jobs:
  integration-tests:
    uses: arjun11-malik/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    with:
      provider: k8s
      use-canonical-k8s: true
      channel: 1.33-classic/stable
      juju-channel: 3.6/stable
      charmcraft-channel: latest/candidate
      modules: '["test_charm.py", "test_refresh.py"]'
      pre-run-script: .github/scripts/init-pytest-ui.sh

